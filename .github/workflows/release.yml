name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: skillswitchman

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: skillswitchman-linux-x86_64
            archive: skillswitchman-linux-x86_64.tar.gz
            binary: target/release/skillswitchman
          - name: macos
            os: macos-latest
            artifact: skillswitchman-macos
            archive: skillswitchman-macos.tar.gz
            binary: target/release/skillswitchman
          - name: windows-x86_64
            os: windows-latest
            artifact: skillswitchman-windows-x86_64
            archive: skillswitchman-windows-x86_64.zip
            binary: target/release/skillswitchman.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ env.BIN_NAME }}"
          tar -czf "${{ matrix.archive }}" -C dist "${{ env.BIN_NAME }}"

      - name: Package release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "${{ matrix.binary }}" "dist/${{ env.BIN_NAME }}.exe"
          Compress-Archive -Path "dist/${{ env.BIN_NAME }}.exe" -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  update-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: skillswitchman-macos

      - name: Compute version and sha256
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum skillswitchman-macos.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: shogoisaji/homebrew-skill-switch-man
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update formula
        working-directory: tap
        run: |
          sed -i \
            -e "s|download/v[^/]*/|download/v${{ steps.meta.outputs.version }}/|" \
            -e "s|^  version \".*\"|  version \"${{ steps.meta.outputs.version }}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${{ steps.meta.outputs.sha256 }}\"|" \
            Formula/skill-switch-man.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "skill-switch-man ${{ steps.meta.outputs.version }}"
          git push
